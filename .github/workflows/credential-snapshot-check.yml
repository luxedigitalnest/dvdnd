name: Credential snapshot verification
on:
  push:
    branches: [verify/credential-snapshot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Refresh verified snapshot from public testnet history
        run: pnpm vitest run src/lib/credential-snapshot.live.test.ts
        env:
          REFRESH_CREDENTIAL_SNAPSHOT: "1"
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
      - uses: actions/upload-artifact@v4
        with:
          name: verified-testnet-credential-snapshot
          path: app/public/credential-snapshot.json
          if-no-files-found: error
